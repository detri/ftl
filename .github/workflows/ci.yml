name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            os: windows-latest
            compiler: msvc
            build_dir: build-msvc

          - name: Clang-CL
            os: windows-latest
            compiler: clang-cl
            build_dir: build-clang-cl

          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build_dir: build-gcc

          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            cc: clang-19
            cxx: clang++-19
            build_dir: build-clang

          - name: macOS AppleClang
            os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++
            build_dir: build-apple-clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $env:CC = "cl"
          $env:CXX = "cl"
          cmake `
            -S . `
            -B "${{ matrix.build_dir }}" `
            -G Ninja `
            -DBUILD_TESTING=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure Clang-CL
        if: matrix.compiler == 'clang-cl'
        shell: pwsh
        run: |
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          cmake `
            -S . `
            -B "${{ matrix.build_dir }}" `
            -G Ninja `
            -DBUILD_TESTING=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake \
            -S . \
            -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" --parallel

      - name: Run tests
        run: >
          ctest
          --test-dir "${{ matrix.build_dir }}"
          --build-config Release
          --output-on-failure