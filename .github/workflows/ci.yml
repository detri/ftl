name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]] ||
             [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- include tests; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.name }}
    needs: changes
    if: >-
      ${{ always() &&
          (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            os: windows-latest
            compiler: msvc
            build_dir: build-msvc

          - name: Clang-CL
            os: windows-latest
            compiler: clang-cl
            build_dir: build-clang-cl

          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build_dir: build-gcc

          - name: Linux Clang
            os: ubuntu-26.04
            compiler: clang
            cc: clang-20
            cxx: clang++-20
            build_dir: build-clang

          - name: macOS AppleClang
            os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++
            build_dir: build-apple-clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $env:CC = "cl"
          $env:CXX = "cl"
          cmake `
            -S . `
            -B "${{ matrix.build_dir }}" `
            -G Ninja `
            -DBUILD_TESTING=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure Clang-CL
        if: matrix.compiler == 'clang-cl'
        shell: pwsh
        run: |
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          cmake `
            -S . `
            -B "${{ matrix.build_dir }}" `
            -G Ninja `
            -DBUILD_TESTING=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake \
            -S . \
            -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" --parallel

      - name: Run tests
        run: >
          ctest
          --test-dir "${{ matrix.build_dir }}"
          --build-config Release
          --output-on-failure

  ci:
    name: CI
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          [[ "$TEST_RESULT" == success ]] ||
          [[ "$CHANGES_RESULT" == success &&
             "$CODE_CHANGED" == false &&
             "$TEST_RESULT" == skipped ]]